# Arm pidt-opus: the pi-dev-team candidate of arm pidt-next on Claude Opus 5.5 through Copilot.
#
# Loads into slop_code.agent_runner.agents.pi.agent.PiConfig (extra="forbid").
#
# Model is NOT set here: run.sh passes github-copilot/copilot-claude-opus-5.5,
# the model arm A (Claude Code) uses, so only the harness differs from arm A.
# version and docker_template match agents/pidt-next.yaml, so both arms share
# one image (slop-code:pi-1.3.0-pdtfeb5afd-python3.12, prebuilt by
# scripts/build_pidt_local.sh while the commit is not on GitHub).
#
# docker_template is resolved relative to the CWD: run slop-code from the
# eval_coding repo root.
type: pi
binary: pi
version: 1.3.0-pdtfeb5afd
docker_template: templates/pidt-next.j2
provider: github-copilot
thinking: high
timeout: 10800 # seconds; plan + build + reviewer swarm runs longer than a bare agent
extra_args:
  - "-e"
  - /opt/pi-dev-team
env:
  PI_TELEMETRY: "0"
cost_limits:
  cost_limit: 0
  net_cost_limit: 0
  step_limit: 0
