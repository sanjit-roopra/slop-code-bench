# Optional arm. Plain pi 1.3.0 (no extension) + SCB just-solve prompt.
#
# Subset: frozen copy of SCB configs/runs/lite_under20.yaml @ upstream 31ceea3
# ("Strict under-$20 subset chosen from historical run correlations."). Problem list copied verbatim; do not edit
# without re-freezing against a new SCB SHA.
#
# Run from harness_eval/ (relative paths resolve against CWD):
#   TMPDIR=/tmp uv run --project .. slop-code run --config runs/pi-stock_lite_under20.yaml
