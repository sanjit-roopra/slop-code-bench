agent: agents/pi-stock.yaml
environment: environments/docker-python3.12-uv-pidt.yaml
prompt: just-solve
model:
  provider: github-copilot
  name: gpt-6.1-sol
thinking: high
save_dir: outputs
save_template: lite_under20/pi-stock/${model.name}_${agent.version}_${thinking}_${prompt}/${now:%Y%m%dT%H%M}
problems:
  - mvvault
  - xjq
