# Arm A. Stock SCB environment and just-solve prompt (bare names resolve from the fork's configs/).
#
# Subset: frozen copy of SCB configs/runs/lite.yaml @ upstream 31ceea3
# ("Lightweight debug/experimentation subset with one API problem."). Problem list copied verbatim; do not edit
# without re-freezing against a new SCB SHA.
#
# Run from harness_eval/ (relative paths resolve against CWD):
#   TMPDIR=/tmp uv run --project .. slop-code run --config runs/cc-clean_lite.yaml
# pass_policy is left at SCB's default, as in the upstream subset file.
agent: agents/cc-clean.yaml
environment: docker-python3.12-uv
prompt: just-solve
model:
  provider: claude_code_oauth
  name: opus-5.5
thinking: high
save_dir: outputs
save_template: lite/cc-clean/${model.name}_${agent.version}_${thinking}_${prompt}/${now:%Y%m%dT%H%M}
problems:
  - code_search
  - xjq
  - file_backup
  - etl_pipeline
  - datagate
