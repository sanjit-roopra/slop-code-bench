# Optional arm. Plain pi 1.3.0 (no extension) + SCB just-solve prompt.
#
# Subset: frozen copy of SCB configs/runs/lite.yaml @ upstream 31ceea3
# ("Lightweight debug/experimentation subset with one API problem."). Problem list copied verbatim; do not edit
# without re-freezing against a new SCB SHA.
#
# Run from harness_eval/ (relative paths resolve against CWD):
#   TMPDIR=/tmp uv run --project .. slop-code run --config runs/pi-stock_lite.yaml
# pass_policy is left at SCB's default, as in the upstream subset file.
agent: agents/pi-stock.yaml
environment: environments/docker-python3.12-uv-pidt.yaml
prompt: just-solve
model:
  provider: github-copilot
  name: gpt-6.1-sol
thinking: high
save_dir: outputs
save_template: lite/pi-stock/${model.name}_${agent.version}_${thinking}_${prompt}/${now:%Y%m%dT%H%M}
problems:
  - code_search
  - xjq
  - file_backup
  - etl_pipeline
  - datagate
