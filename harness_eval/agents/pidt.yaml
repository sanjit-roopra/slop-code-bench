# Arm B: pi 1.3.0 + pi-dev-team extension (SHA 3c34bf5).
#
# Loads into slop_code.agent_runner.agents.pi.agent.PiConfig (extra="forbid").
#
# version is the SCB image cache key (AgentConfigBase.get_image ->
# "pi-<version>-<env name>"), so it carries the pi-dev-team SHA: bumping the
# extension SHA in templates/pidt.j2 MUST bump this string too, or SCB reuses
# a stale image. The template hardcodes pi 1.3.0 and ignores {{ version }}.
#
# Model is NOT set here: it comes from the run config
# (model: {provider: github-copilot, name: gpt-6.1-sol}). The Opus variant
# (arm C) is the same agent config with a different run-config model, see
# runs/pidt-opus_*.yaml; both share one image.
#
# docker_template is resolved relative to the CWD: run slop-code from the
# harness_eval/ directory.
type: pi
binary: pi
version: 1.3.0-pdt3c34bf5
docker_template: templates/pidt.j2
provider: github-copilot
thinking: high
timeout: 10800 # seconds; plan + build + reviewer swarm runs longer than a bare agent
extra_args:
  - "-e"
  - /opt/pi-dev-team
env:
  PI_TELEMETRY: "0"
cost_limits:
  cost_limit: 0
  net_cost_limit: 0
  step_limit: 0
