# Arm C (optional). Same agent config + image as arm B; only the model differs
# (Claude Opus 5.5 via GitHub Copilot). Model is a run-config choice, so there is
# no separate agents/pidt-opus.yaml.
#
# Subset: frozen copy of SCB configs/runs/lite_under20.yaml @ upstream 31ceea3
# ("Strict under-$20 subset chosen from historical run correlations."). Problem list copied verbatim; do not edit
# without re-freezing against a new SCB SHA.
#
# Run from the eval_coding repo root (relative paths resolve against CWD):
#   TMPDIR=/tmp uv run --project vendor/slop-code-bench slop-code run --config runs/pidt-opus_lite_under20.yaml
# pass_policy is left at SCB's default, as in the upstream subset file.
agent: agents/pidt.yaml
environment: environments/docker-python3.12-uv-pidt.yaml
prompt: prompts/pidt.jinja
model:
  provider: github-copilot
  name: copilot-claude-opus-5.5
thinking: high
save_dir: outputs
save_template: lite_under20/pidt-opus/${model.name}_${agent.version}_${thinking}_${prompt}/${now:%Y%m%dT%H%M}
problems:
  - mvvault
  - xjq
